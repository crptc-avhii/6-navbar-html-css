<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlex Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <!-- Mobile Menu Checkbox -->
        <input type="checkbox" id="menuCheckbox" class="menuCheckbox">

        <div class="navbar">

            <!-- Logo -->
            <a href="#" class="logo">
                <span class="logoIcon">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M19.5 3C10 3 4 7.5 4 14.5C4 18 6.5 20 9.5 20C16.5 20 20 11 19.5 3Z" fill="white" />
                        <path d="M4 21L15 8" stroke="#07565A" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </span>

                <span class="logoText">EduFlex</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="desktopNav">
                <a href="#" class="navLink active">Home</a>
                <a href="#" class="navLink">Courses</a>
                <a href="#" class="navLink">Resources</a>
                <a href="#" class="navLink">Community</a>
                <a href="#" class="navLink">About</a>
            </nav>

            <!-- Navbar Actions -->
            <div class="navActions">
                <a href="#" class="loginLink">Log in</a>
                <a href="#" class="joinButton desktopJoin">
                    Join for Free
                </a>
            </div>

            <!-- Hamburger Button -->
            <label for="menuCheckbox" class="menuToggle">
                <span></span>
                <span></span>
                <span></span>
            </label>

        </div>

        <!-- Mobile Navigation -->
        <nav class="mobileNav">

            <a href="#" class="mobileNavLink active">Home</a>

            <a href="#" class="mobileNavLink">
                Courses
                <span class="dropdownIcon">⌄</span>
            </a>

            <a href="#" class="mobileNavLink">Resources</a>

            <a href="#" class="mobileNavLink">Community</a>

            <a href="#" class="mobileNavLink">About</a>

            <div class="mobileNavBottom">
                <a href="#" class="joinButton mobileJoin">
                    Join for Free
                </a>
            </div>

        </nav>

    </header>

</body>

</html>
